<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ (Login)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-image: url('bg.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.25); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
        }
        h2 { color: #1e293b; margin-top: 0; margin-bottom: 20px; font-size: 24px; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            border: 1px solid #cbd5e1; border-radius: 6px; 
            box-sizing: border-box; font-family: 'Sarabun'; font-size: 15px; 
        }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn { 
            width: 100%; padding: 12px; margin-top: 15px; 
            border: none; border-radius: 6px; cursor: pointer; 
            font-family: 'Sarabun'; font-weight: 600; font-size: 16px; 
            color: white; transition: 0.2s; 
        }
        .btn-login { background-color: #2563eb; }
        .btn-login:hover { background-color: #1d4ed8; }
        .btn-change { background-color: #f59e0b; }
        .btn-cancel { background-color: #94a3b8; margin-top: 10px; }
        
        #message, #changeMsg { margin-top: 15px; font-size: 14px; font-weight: bold; }
        
        .text-link {
            display: block; margin-top: 15px; font-size: 14px; color: #64748b; 
            cursor: pointer; text-decoration: underline; transition: 0.2s;
        }
        .text-link:hover { color: #2563eb; }

        #adminPanel, #changePasswordPanel { display: none; }
        .btn-osr { background-color: #10b981; margin-bottom: 10px; }
        .btn-agent { background-color: #f59e0b; }
        .btn-logout { background-color: #ef4444; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

<!-- 1. หน้าต่างเข้าสู่ระบบหลัก -->
<div class="login-box" id="loginPanel">
    <h2>🔒 เข้าสู่ระบบ</h2>
    <input type="text" id="identifier" placeholder="อีเมล หรือ Username">
    <input type="password" id="password" placeholder="รหัสผ่าน (Password)" onkeypress="if(event.key === 'Enter') login()">
    <button class="btn btn-login" onclick="login()" id="loginBtn">เข้าสู่ระบบ</button>
    <span class="text-link" onclick="togglePanel('changePasswordPanel')">ต้องการเปลี่ยนรหัสผ่าน?</span>
    <div id="message"></div>
</div>

<!-- 2. หน้าต่างเปลี่ยนรหัสผ่าน -->
<div class="login-box" id="changePasswordPanel">
    <h2>🔑 เปลี่ยนรหัสผ่าน</h2>
    <p style="font-size: 13px; color: #64748b; margin-top: 0;">กรุณายืนยันตัวตนด้วยรหัสผ่านเดิม</p>
    <input type="text" id="cpIdentifier" placeholder="อีเมล หรือ Username">
    <input type="password" id="cpOldPassword" placeholder="รหัสผ่านเดิม">
    <input type="password" id="cpNewPassword" placeholder="รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)" onkeypress="if(event.key === 'Enter') changePassword()">
    <button class="btn btn-change" onclick="changePassword()" id="changeBtn">บันทึกรหัสผ่านใหม่</button>
    <button class="btn btn-cancel" onclick="togglePanel('loginPanel')">ยกเลิก / กลับไปเข้าสู่ระบบ</button>
    <div id="changeMsg"></div>
</div>

<!-- 3. หน้าต่างเลือกฝั่งสำหรับ Admin -->
<div class="login-box" id="adminPanel">
    <h2>👑 ยินดีต้อนรับ (Admin)</h2>
    <p style="color: #475569; margin-bottom: 20px;">กรุณาเลือกระบบที่คุณต้องการเข้าใช้งาน</p>
    <button class="btn btn-osr" onclick="window.location.href='OSR.html'">➡️ เข้าสู่ระบบฝั่ง OSR</button>
    <button class="btn btn-agent" onclick="window.location.href='Agent.html'">➡️ เข้าสู่ระบบฝั่ง Agent</button>
    <button class="btn btn-logout" onclick="logout()">ออกจากระบบ</button>
</div>

<script>
    const SUPABASE_URL = 'https://iqzurohkdxcmyydixdmv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxenVyb2hrZHhjbXl5ZGl4ZG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjU1NDgsImV4cCI6MjA5NDY0MTU0OH0.Ks85DSc17zkPJ5Pzn-Ay7jO9vzsI2HkVXmlpUq8vewo';
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // เช็คว่าเคยล็อกอินค้างไว้หรือไม่
    async function checkCurrentSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) checkRoleAndRedirect(session.user.id);
    }
    checkCurrentSession();

    // ฟังก์ชันสลับหน้าต่าง UI
    function togglePanel(panelId) {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('changePasswordPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById(panelId).style.display = 'block';
        document.getElementById('message').innerText = '';
        document.getElementById('changeMsg').innerText = '';
    }

    // ฟังก์ชันช่วยหา Email จาก Username
    async function resolveEmail(identifier) {
        // ถ้ามี @ ถือว่าเป็น Email อยู่แล้ว ส่งกลับไปเลย
        if (identifier.includes('@')) return identifier;

        // ถ้าไม่มี @ ให้ถือว่าเป็น Username แล้วไปค้นหาอีเมลใน user_roles
        const { data, error } = await supabaseClient
            .from('user_roles')
            .select('email')
            .eq('user', identifier)
            .single();

        if (error || !data) return null; // หาไม่เจอ
        return data.email;
    }

    // -----------------------------------------------------
    // ฟังก์ชันเข้าสู่ระบบ
    // -----------------------------------------------------
    async function login() {
        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        if(!identifier || !password) {
            msg.style.color = '#ef4444'; msg.innerText = 'กรุณากรอกข้อมูลให้ครบถ้วน'; return;
        }

        msg.style.color = '#2563eb'; msg.innerText = 'กำลังตรวจสอบข้อมูล...';
        loginBtn.disabled = true;

        // แปลง Username เป็น Email (ถ้าผู้ใช้พิมพ์ Username มา)
        const emailToLogin = await resolveEmail(identifier);
        
        if (!emailToLogin) {
            msg.style.color = '#ef4444'; msg.innerText = 'ไม่พบ Username หรืออีเมลนี้ในระบบ';
            loginBtn.disabled = false; return;
        }

        // ส่ง Email ไปล็อกอิน
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: emailToLogin, password: password
        });

        if (error) {
            msg.style.color = '#ef4444'; msg.innerText = 'รหัสผ่านไม่ถูกต้อง';
            loginBtn.disabled = false;
        } else {
            msg.innerText = 'ล็อกอินสำเร็จ กำลังตรวจสอบสิทธิ์...';
            await checkRoleAndRedirect(data.user.id);
        }
    }

    // ฟังก์ชันแยก Role
    // ฟังก์ชันแยก Role
    async function checkRoleAndRedirect(userId) {
        const msg = document.getElementById('message');
        const { data: userData, error: roleError } = await supabaseClient.from('user_roles').select('role').eq('user_id', userId).single();

        if (roleError || !userData) {
            msg.style.color = '#ef4444'; msg.innerText = 'ไม่พบสิทธิ์การใช้งาน';
            await supabaseClient.auth.signOut();
            document.getElementById('loginBtn').disabled = false; return;
        }

        const userRole = userData.role.toLowerCase().trim();
        
        if (userRole === 'admin') {
            // ถ้าเป็นแอดมิน โชว์หน้าต่างแผงควบคุม
            togglePanel('adminPanel');
            
            // 🎯 พิเศษสำหรับ Admin: เพิ่มปุ่มให้เข้า Call Center ได้ด้วย (ถ้ายังไม่มีปุ่มนี้)
            const adminPanel = document.getElementById('adminPanel');
            if(!adminPanel.innerHTML.includes('Call Center')) {
                const btnCC = document.createElement('button');
                btnCC.className = 'btn';
                btnCC.style.backgroundColor = '#8b5cf6'; // สีม่วง
                btnCC.style.marginBottom = '10px';
                btnCC.innerHTML = '➡️ เข้าสู่ระบบฝั่ง Call Center';
                btnCC.onclick = () => window.location.href = 'CallCenter.html';
                
                // เอาไปแทรกไว้ก่อนปุ่ม "ออกจากระบบ"
                const logoutBtn = adminPanel.querySelector('.btn-logout');
                adminPanel.insertBefore(btnCC, logoutBtn);
            }
        }
        else if (userRole === 'osr') window.location.href = 'OSR.html';
        else if (userRole === 'agent') window.location.href = 'Agent.html';
        else if (userRole === 'callcenter') window.location.href = 'CallCenter.html'; // 🎯 เพิ่มเงื่อนไขให้คนที่เป็น Call Center
        else {
            msg.style.color = '#ef4444'; msg.innerText = 'สิทธิ์ไม่ถูกต้อง (' + userRole + ')';
            await supabaseClient.auth.signOut();
            document.getElementById('loginBtn').disabled = false;
        }
    }

    // -----------------------------------------------------
    // ฟังก์ชันเปลี่ยนรหัสผ่าน
    // -----------------------------------------------------
    async function changePassword() {
        const identifier = document.getElementById('cpIdentifier').value.trim();
        const oldPassword = document.getElementById('cpOldPassword').value;
        const newPassword = document.getElementById('cpNewPassword').value;
        const msg = document.getElementById('changeMsg');
        const changeBtn = document.getElementById('changeBtn');

        if(!identifier || !oldPassword || !newPassword) {
            msg.style.color = '#ef4444'; msg.innerText = 'กรุณากรอกข้อมูลให้ครบถ้วน'; return;
        }
        if(newPassword.length < 6) {
            msg.style.color = '#ef4444'; msg.innerText = 'รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร'; return;
        }

        msg.style.color = '#2563eb'; msg.innerText = 'กำลังตรวจสอบข้อมูล...';
        changeBtn.disabled = true;

        const emailToLogin = await resolveEmail(identifier);
        if (!emailToLogin) {
            msg.style.color = '#ef4444'; msg.innerText = 'ไม่พบ Username นี้';
            changeBtn.disabled = false; return;
        }

        // 1. ลองล็อกอินด้วยรหัสผ่านเดิม เพื่อยืนยันตัวตน
        const { error: signInError } = await supabaseClient.auth.signInWithPassword({
            email: emailToLogin, password: oldPassword
        });

        if (signInError) {
            msg.style.color = '#ef4444'; msg.innerText = 'รหัสผ่านเดิมไม่ถูกต้อง';
            changeBtn.disabled = false; return;
        }

        // 2. ถ้ารหัสเดิมถูก สั่งอัปเดตรหัสใหม่ทันที
        const { error: updateError } = await supabaseClient.auth.updateUser({
            password: newPassword
        });

        if (updateError) {
            msg.style.color = '#ef4444'; msg.innerText = 'เกิดข้อผิดพลาด: ' + updateError.message;
            changeBtn.disabled = false;
        } else {
            // สำเร็จ -> ล็อกเอาท์ออก เพื่อบังคับให้ไปล็อกอินใหม่ด้วยรหัสใหม่
            await supabaseClient.auth.signOut();
            msg.style.color = '#10b981'; 
            msg.innerText = '✅ เปลี่ยนรหัสผ่านสำเร็จ! กรุณาล็อกอินใหม่';
            
            // ล้างข้อมูลในช่อง
            document.getElementById('cpIdentifier').value = '';
            document.getElementById('cpOldPassword').value = '';
            document.getElementById('cpNewPassword').value = '';
            
            // รอ 2 วินาที แล้วกลับไปหน้าล็อกอินปกติ
            setTimeout(() => {
                togglePanel('loginPanel');
                changeBtn.disabled = false;
            }, 2000);
        }
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.reload();
    }
</script>

</body>
</html>
